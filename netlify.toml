# Optional Netlify build config (legacy / alternate host).
# Production frontend: https://churchtrack-system.vercel.app/ (Vercel).
# App folder: faithtrack/

[build]
  base = "faithtrack"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
